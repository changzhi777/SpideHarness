# 飞书智能体配置
# App ID: cli_a976c6aaaa7adcbb（已确认）
# LLM: Google Gemma 3 4B（端口 8001，本地推理）
#
# ⚠️ 安全说明：
#   app_secret / verification_token / encrypt_key 均为敏感字段，
#   严禁明文提交到 Git！请使用 ${ENV_VAR[:default]} 占位符从环境变量注入：
#
#     export SPIDE_FEISHU__APP_SECRET=xxxxxxxx
#     export SPIDE_FEISHU__VERIFICATION_TOKEN=xxxxxxxx  # 可选
#     export SPIDE_FEISHU__ENCRYPT_KEY=xxxxxxxx          # 可选
#
#   加载时由 dashboard/secrets.py:resolve_secrets_in_obj() 替换。

feishu:
  app_id: cli_a976c6aaaa7adcbb
  app_secret: ${SPIDE_FEISHU__APP_SECRET}             # 必填 → 环境变量
  verification_token: ${SPIDE_FEISHU__VERIFICATION_TOKEN:}  # 选填 → 默认空
  encrypt_key: ${SPIDE_FEISHU__ENCRYPT_KEY:}          # 选填 → 默认空
  # WebSocket 长连接配置（推荐，无需公网 URL）
  ws:
    enabled: true                       # 是否启用 WebSocket 长连接
  # 默认推送目标（主动推送）
  default_chat_id: ""                  # 群 chat_id 或 user open_id

llm:
  base_url: http://10.10.10.138:8001   # 家庭网络内 LLM 服务（OpenAI 兼容端点）
  model: gemma-4-e4b-it-4bit           # MLX 服务实际模型名（Q4_K_M 量化）
  api_key: ${SPIDE_LLM__LOCAL_API_KEY:EMPTY}  # 本地服务鉴权 key（ak47）
  timeout: 180                          # 实测 0.15 t/s,长 prompt 可能需 1-3 分钟
  max_tokens: 2048
  temperature: 0.7
  supports_function_calling: false     # Gemma 4 e4b 弱 → JSON Action 兜底

agent:
  # ReAct 循环参数
  max_iterations: 5                    # 最大迭代次数（防死循环）
  max_history: 20                      # 多轮记忆窗口
  step_timeout: 30                     # 单次工具调用超时（秒）
  system_prompt: |
    你是「青沐信息官」，一位专业、亲切的信息助手。
    你可以调用工具采集热搜、分析趋势、生成词云、追踪话题、跨平台关联分析。
    回答简洁专业，使用中文，必要时输出富文本卡片。
    工具调用规则：
    - 若需要执行操作，输出 JSON Action：```json{"action": "工具名", "arguments": {...}}```
    - 若只需回答，直接输出文本
    - 同一轮最多调用 1 个工具

scheduler:
  enabled: true                        # 主动推送总开关（需 app_secret）
  jobs:
    - name: daily_morning_brief
      cron: "0 9 * * *"                # 每日 09:00
      action: crawl_hot_topics
      params:
        source: weibo
        limit: 10
      push_card: true
      target_chat_id: ""               # 留空使用默认
    - name: daily_evening_brief
      cron: "0 18 * * *"
      action: crawl_hot_topics
      params:
        source: weibo
        limit: 10
      push_card: true
      target_chat_id: ""

storage:
  conversation_db: spide_data.db       # 复用主数据库

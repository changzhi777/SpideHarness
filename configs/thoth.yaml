# Thoth 知识库配置（不入 Git，参考 configs/feishu.yaml 模式）
#
# 获取 token 方法（待 Thoth PG 问题修复后 register/login）：
#   1. 浏览器登录 Thoth Web UI (http://10.10.10.15:8765)
#   2. DevTools → Network → 任意请求 → 复制 Authorization: Bearer xxx
#   或：
#   POST /api/auth/register {"username":"spide_bot","password":"..."}
#   POST /api/auth/login  {"username":"spide_bot","password":"..."} → access_token
#
# 当前状态（2026-06-14）：Thoth PG sslmode 限制未解，register 暂不可用
# TODO: 配置有效 token 后删除本注释

thoth:
  base_url: "http://10.10.10.15:8765"
  token: "${THOTH_API_TOKEN:}"   # 占位：环境变量 THOTH_API_TOKEN
  default_room_id: "room_video_2026"
  timeout: 30.0

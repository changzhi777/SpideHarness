# SpideHarness Agent 反向代理配置（PVE 宿主机）
# 部署位置：/etc/nginx/sites-available/spide
# 启用：ln -s /etc/nginx/sites-available/spide /etc/nginx/sites-enabled/spide
#
# 端口说明：PVE 宿主机 80/443/8006 已被占用，使用 8443(HTTPS) + 8088(HTTP)
# 家庭路由器/防火墙做端口映射：443 → 8443, 80 → 8088

# HTTP → HTTPS 重定向
server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTPS 终止 + 反向代理
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    # 自签证书
    ssl_certificate     /etc/nginx/ssl/spide.crt;
    ssl_certificate_key /etc/nginx/ssl/spide.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 日志
    access_log /var/log/nginx/spide.access.log;
    error_log  /var/log/nginx/spide.error.log;

    # 反代到 CT107:8765（实际 IP: 10.10.10.16）
    location / {
        proxy_pass http://10.10.10.16:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（飞书长连接）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时（LLM 响应可能慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout   300s;

        # 缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

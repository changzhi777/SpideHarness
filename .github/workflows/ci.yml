# SpideHarness Agent CI Workflow
# 触发: push / pull_request 到 main 分支
# 步骤: lint → type-check → unit test + coverage (50%)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: 质量门（lint + type + coverage）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 设置 Python
        run: uv python install 3.12

      - name: 同步依赖
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy 类型检查
        run: uv run mypy spide/ dashboard/ --explicit-package-bases

      - name: 单元测试 + 覆盖率（≥50%）
        run: uv run pytest tests/unit/ --cov-fail-under=50 --cov-report=xml --cov-report=term

      - name: 上传 coverage 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
